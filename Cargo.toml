[package]
name = "throisma"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.5.61", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
dirs = "6.0.0"
hound = "3.5.1"
# значок записи в трее (StatusNotifierItem); async-io вместо tokio — рантайм полегче
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
nix = { version = "0.31.3", features = ["signal", "process"] }
pipewire = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# vulkan: транскрипция на GPU (нужны vulkan-loader-devel и glslc)
whisper-rs = { version = "0.16.0", features = ["vulkan"] }
